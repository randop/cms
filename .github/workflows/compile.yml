name: CI

on:
  push:
    branches: ["master"]
    paths-ignore:
      - '**/*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.clang-format'
      - 'cms.kdev4'
      - '.dockerignore'
      - 'LICENSE'
      - '.codespellrc'
      - '.gitlab-ci.yml'
  pull_request:
    branches: ["master"]
    paths-ignore:
      - '**/*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.clang-format'
      - 'cms.kdev4'
      - '.dockerignore'
      - 'LICENSE'
      - '.codespellrc'
  schedule:
    - cron: '0 0 * * 1' # Runs at 00:00 on every Monday UTC

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # NOTE: Bump the version to force refresh
      - name: APT cache
        id: apt-key
        run: |
          echo "key=${{ runner.os }}-apt-toolchain-v2026-07" >> $GITHUB_OUTPUT

      - name: Cache APT packages
        uses: actions/cache@v6
        id: cache-apt
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
            /var/cache/apt/pkgcache.bin
            /var/cache/apt/srcpkgcache.bin
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-apt-toolchain-

      - name: Update package lists
        run: sudo DEBIAN_FRONTEND=noninteractive apt update -qqq -y

      - name: Install development toolchain
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt install -qqq -y -o Dpkg::Progress-Fancy=0 -o APT::Color=0 -o Dpkg::Use-Pty=0 --no-install-recommends \
            git meson libboost-all-dev libzstd-dev ccache

      # Keep downloaded packages for future runs
      - name: Configure APT to keep downloaded packages
        run: |
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/keep-cache > /dev/null

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "2G"
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ hashFiles('meson.build', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.job }}-

      - name: Cache mongo-c-driver
        id: cache-mongoc
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/libmongoc*
            /usr/local/lib/libbson*
            /usr/local/include/libmongoc*
            /usr/local/include/bson*
            /opt/mongo-c-driver
            /etc/ld.so.conf.d/mongoc-driver.conf
            /usr/lib/pkgconfig/bson.pc
            /usr/lib/pkgconfig/bson-static.pc
            /usr/lib/pkgconfig/bson2.pc
            /usr/lib/pkgconfig/bson2-static.pc
            /usr/lib/pkgconfig/mongoc.pc
            /usr/lib/pkgconfig/mongoc2.pc
            /usr/lib/pkgconfig/mongoc2-static.pc
          key: ${{ runner.os }}-mongoc-driver-${{ hashFiles('scripts/mongoc.sh') }}
          restore-keys: |
            ${{ runner.os }}-mongoc-driver-

      - name: Cache mongo-cpp-driver
        id: cache-mongocpp
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/libbsoncxx*
            /usr/local/lib/libmongocxx*
            /usr/local/include/bsoncxx
            /usr/local/include/mongocxx
            /opt/mongo-cpp-driver
            /etc/ld.so.conf.d/mongocpp-driver.conf
            /usr/lib/pkgconfig/libbsoncxx1-static.pc
            /usr/lib/pkgconfig/libmongocxx1-static.pc
          key: ${{ runner.os }}-mongocpp-driver-${{ hashFiles('scripts/mongocpp.sh') }}
          restore-keys: |
            ${{ runner.os }}-mongocpp-driver-

      - name: Make mongoc script executable
        run: chmod +x scripts/mongoc.sh

      - name: Run mongo c driver compile script
        run: ./scripts/mongoc.sh

      - name: Make mongocpp script executable
        run: chmod +x scripts/mongoc.sh

      - name: Run mongo cpp driver compile script
        run: ./scripts/mongocpp.sh

      - name: Cache Meson build directory
        id: cache-meson
        uses: actions/cache@v6
        with:
          path: build
          key: ${{ runner.os }}-meson-build-${{ hashFiles('meson.build', 'subprojects/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-meson-build-${{ hashFiles('meson.build', 'subprojects/**') }}-
            ${{ runner.os }}-meson-build-

      - name: Setup meson build
        run: meson setup build --prefer-static --default-library=static --reconfigure

      - name: Compile CMS application
        run: meson compile -C build -j $(nproc)

      - name: ccache stats
        run: ccache -s

  trigger-deploy:
    runs-on: ubuntu-latest
    needs: compile

    # Only run if the 'compile' job was successful
    if: success()

    steps:
      - name: Trigger deploy
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GIT_HUB_WORKFLOW_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: '${{ github.ref_name }}'
            })